<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#F6F5F0">
  <title>A minha Lista</title>
  <script>
    const VERSAO_ATUAL = '0.0.17';
    if (localStorage.getItem('app_version') !== VERSAO_ATUAL) {
      if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(r => r.forEach(x => x.unregister()));
      if (window.caches) caches.keys().then(k => k.forEach(c => caches.delete(c)));
      localStorage.setItem('app_version', VERSAO_ATUAL);
    }
  </script>
  <link rel="stylesheet" href="style-v2.css?v=0.0.17">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="img/appLogo.png">
</head>
<body>

<!-- Ícones (sprite inline, sem dependências externas) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-share" viewBox="0 0 24 24"><path d="M12 15V3M8 7l4-4 4 4M5 12v7a2 2 0 002 2h10a2 2 0 002-2v-7"/></symbol>
    <symbol id="i-broom" viewBox="0 0 24 24"><path d="M20 4l-8 8M9.5 10.5l4 4L9 20H4l.5-5zM14 20l1.5-3M10 21l1-2"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 002 2h6a2 2 0 002-2l1-12M9 7V4h6v3"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></symbol>
    <symbol id="i-bag" viewBox="0 0 24 24"><path d="M5 8h14l-1 12H6zM9 8V6a3 3 0 016 0v2"/></symbol>
    <symbol id="i-cart" viewBox="0 0 24 24"><path d="M3 4h2.5l2 11h10l2-8H7M10 20h.01M17 20h.01"/></symbol>
    <symbol id="i-cart-plus" viewBox="0 0 24 24"><path d="M2.5 4H5l2 10.5h10.5l1.8-7.5H8M10 20h.01M17 20h.01M13 8v5M10.5 10.5h5"/></symbol>
    <symbol id="i-store" viewBox="0 0 24 24"><path d="M4 9l1.5-5h13L20 9M4 9v11h16V9M4 9c0 2 3 2 4 0 1 2 3 2 4 0 1 2 3 2 4 0 1 2 4 2 4 0M10 20v-5h4v5"/></symbol>
    <symbol id="i-flyer" viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6zM14 3v5h5M9 13h7M9 17h5"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></symbol>
  </defs>
</svg>

<div class="app">

  <!-- 1. Top Action Bar -->
  <header>
    <div class="topbar">
      <button class="circle-btn" onclick="partilharTudo()" aria-label="Partilhar todas as listas">
        <svg class="icon"><use href="#i-share"/></svg>
      </button>
      <div class="capsule" role="group" aria-label="Ações rápidas">
        <button class="circle-btn" onclick="abrirModalLimpeza()" aria-label="Limpar concluídos"><svg class="icon"><use href="#i-broom"/></svg></button>
        <button class="circle-btn" id="btn-ver-tudo" onclick="alternarVerTudo()" aria-label="Mostrar todas as lojas" aria-pressed="false"><svg class="icon"><use href="#i-menu"/></svg></button>
      </div>
    </div>
    <div class="title-block">
      <h1>A minha Lista</h1>
      <p>Onde vamos hoje?</p>
    </div>
  </header>

  <!-- 2. Pesquisa -->
  <div class="search">
    <svg class="icon"><use href="#i-search"/></svg>
    <label class="sr-only" for="busca">Procurar</label>
    <input id="busca" type="search" placeholder="Procurar produtos ou lojas..." autocomplete="off" enterkeyhint="search">
  </div>

  <!-- 3. Carrossel de supermercados -->
  <nav class="lojas" id="lojas" aria-label="Filtrar por supermercado"></nav>

  <!-- 4. Secções por supermercado -->
  <div class="secoes" id="secoes"></div>
</div>

<!-- 5. Dock flutuante -->
<nav class="dock" aria-label="Navegação principal">
  <button class="tab" aria-current="page" onclick="window.scrollTo({top:0,behavior:'smooth'})"><svg class="icon"><use href="#i-list"/></svg>Listas</button>
  <button class="tab" onclick="abrirLojas()"><svg class="icon"><use href="#i-store"/></svg>Lojas</button>
  <button class="fab" onclick="abrirSheet()" aria-label="Adicionar novo item"><svg class="icon"><use href="#i-cart-plus"/></svg></button>
  <button class="tab" onclick="mostrarToast('Folhetos em breve')"><svg class="icon"><use href="#i-flyer"/></svg>Folhetos</button>
  <button class="tab" onclick="partilharAtual()"><svg class="icon"><use href="#i-share"/></svg>Partilhar</button>
</nav>

<!-- Sheet: novo item -->
<div id="addModal" class="modal" onclick="if(event.target===this) fecharSheet()">
  <form class="modal-content sheet" id="form-add" autocomplete="off" role="dialog" aria-modal="true" aria-labelledby="sheet-titulo">
    <div class="sheet-head">
      <h3 id="sheet-titulo">Novo item</h3>
      <p id="sheet-status" class="sheet-status" role="status" aria-live="polite"></p>
    </div>
    <label class="field"><span>Produto</span>
      <input id="lista-input" type="text" placeholder="O que falta?" maxlength="60" enterkeyhint="enter" autocapitalize="sentences">
    </label>
    <div id="sugestoes" class="chips" aria-label="Sugestões" data-hint="Escreve para ver sugestões"></div>
    <label class="field"><span>Supermercado</span>
      <select id="sheet-loja"></select>
    </label>
    <div class="sheet-actions">
      <button type="button" class="btn-cancel" onclick="fecharSheet()">Concluir</button>
      <button type="submit" class="btn-primary" id="btn-add" disabled>Adicionar</button>
    </div>
  </form>
</div>

<!-- Sheet: Lojas -->
<div id="lojasModal" class="modal" onclick="if(event.target===this) fecharLojas()">
  <div class="modal-content sheet" role="dialog" aria-modal="true" aria-labelledby="lojas-titulo">
    <div class="sheet-head">
      <h3 id="lojas-titulo">Lojas</h3>
    </div>
    <div id="lojas-lista" class="lojas-lista"></div>
    <div class="sheet-actions solo">
      <button type="button" class="btn-cancel" onclick="fecharLojas()">Fechar</button>
    </div>
  </div>
</div>

<!-- Modal de confirmação -->
<div id="confirmModal" class="modal">
  <div class="modal-content">
    <h3></h3>
    <p></p>
    <div class="modal-buttons duo">
      <button class="btn-cancel" onclick="fecharModal()">Não</button>
      <button class="btn-confirm" onclick="confirmarAcao()">Sim</button>
    </div>
  </div>
</div>

<div id="toast-container" class="toast-container" role="status"></div>
<script src="app-v2.js?v=0.0.17"></script>
</body>
</html>
